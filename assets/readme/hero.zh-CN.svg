<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Gemini in Chrome Doctor</title>
  <desc id="desc">一条从地区不匹配、Glic 宿主就绪到内嵌 Gemini 网络稳定的诊断轨迹。</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#18212C" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#0B0F14"/>
  <path d="M0 312H1200" stroke="#111923"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)" opacity="0.55"/>

  <g id="title-block" transform="translate(64 54)">
    <text x="0" y="0" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">MACOS / CHROME / 诊断工具</text>
    <text x="0" y="76" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="58" font-weight="760">Gemini in Chrome</text>
    <text x="0" y="142" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="58" font-weight="760">Doctor</text>
    <text x="0" y="196" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23">定位真正失败的层级，只修复证据指向的问题。</text>

    <g transform="translate(0 242)">
      <rect width="540" height="54" rx="12" fill="#101821" stroke="#263444"/>
      <text x="20" y="34" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">$ ./gemini-chrome-doctor.sh diagnose</text>
      <rect x="506" y="17" width="12" height="20" rx="2" fill="#4ADE80"/>
    </g>
  </g>

  <path d="M660 46V374" stroke="#263444"/>

  <g id="diagnostic-trace" transform="translate(708 46)">
    <rect width="428" height="328" rx="18" fill="#0E151D" stroke="#263444"/>
    <circle cx="26" cy="27" r="5" fill="#FBBF24"/>
    <circle cx="44" cy="27" r="5" fill="#4ADE80"/>
    <circle cx="62" cy="27" r="5" fill="#38BDF8"/>
    <text x="88" y="33" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.4">诊断轨迹</text>
    <path d="M53 82V276" stroke="#334155" stroke-width="2"/>

    <g transform="translate(0 0)">
      <circle cx="53" cy="100" r="27" fill="#211A0E" stroke="#FBBF24" stroke-width="2"/>
      <text x="53" y="108" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">05</text>
      <text x="100" y="96" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700">地区不匹配</text>
      <text x="100" y="122" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, PingFang SC, monospace" font-size="18">Variations 国家缓存</text>
    </g>

    <g transform="translate(0 90)">
      <circle cx="53" cy="100" r="27" fill="#0D2117" stroke="#4ADE80" stroke-width="2"/>
      <text x="53" y="108" text-anchor="middle" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">02</text>
      <text x="100" y="96" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700">Glic 宿主就绪</text>
      <text x="100" y="122" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, PingFang SC, monospace" font-size="18">账号 · 策略 · 地区</text>
    </g>

    <g transform="translate(0 180)">
      <circle cx="53" cy="100" r="27" fill="#0C1D27" stroke="#38BDF8" stroke-width="2"/>
      <text x="53" y="107" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">3/3</text>
      <text x="100" y="96" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700">内嵌客户端在线</text>
      <text x="100" y="122" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Glic · Gemini · Accounts</text>
    </g>
  </g>
</svg>
